<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--rd:#c8102e;--ink:#111;--bg:#fff;--soft:#f6f2f2}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,sans-serif;background:var(--bg);color:var(--ink)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:3px solid var(--ink);position:sticky;top:0;background:#fff;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font:900 26px Cairo;color:var(--rd)}
.wrap{display:flex;min-height:calc(100vh - 66px)}
aside{width:240px;border-inline-start:3px solid var(--ink);padding:18px 14px;background:var(--soft)}
main{flex:1;padding:24px;min-width:0}
.nb{display:flex;align-items:center;gap:10px;width:100%;margin:7px 0;padding:11px 14px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;font:700 15px Cairo;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:.2s}
.nb:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--rd)}.nb.on{background:var(--rd);color:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--rd);color:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:9px 18px;font:700 14px Cairo;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:.15s}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}.btn.w{background:#fff;color:var(--ink)}.btn:disabled{opacity:.5}
.card{border:2.5px solid var(--ink);border-radius:22px;padding:18px;background:#fff;box-shadow:6px 6px 0 var(--rd);margin:14px 0;transition:.25s}
.card:hover{transform:translateY(-3px)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
h1,h2{margin:0 0 14px;font-weight:900}h2:after{content:"";display:block;width:60px;height:5px;background:var(--rd);border-radius:3px;margin-top:4px}
input,select,textarea{width:100%;padding:11px;margin:5px 0;border:2px solid var(--ink);border-radius:12px;font:15px Cairo;background:#fff}
input:focus,textarea:focus{outline:3px solid #c8102e55}
.pg{animation:up .5s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{opacity:0;transform:translateY(18px)}}
.fl{animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px) rotate(2deg)}}
.cnt{font:900 54px Cairo;border:3px solid var(--ink);border-radius:26px;display:inline-block;padding:4px 30px;box-shadow:6px 6px 0 var(--rd);direction:ltr}
.fc{height:160px;perspective:700px;cursor:pointer}.fc>div{position:relative;height:100%;transition:transform .6s;transform-style:preserve-3d}.fc.f>div{transform:rotateY(180deg)}
.fc span{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;border:2.5px solid var(--ink);border-radius:20px;font-weight:700;background:#fff;box-shadow:5px 5px 0 var(--ink)}
.fc span+span{transform:rotateY(180deg);background:var(--rd);color:#fff}
.nt{background:var(--rd);color:#fff;padding:10px 14px;border-radius:14px;margin:6px 0;font-weight:700;display:flex;gap:8px;animation:up .4s}
.m{padding:8px 0;border-bottom:1px dashed #bbb}.mu{color:#777;font-size:13px}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9;animation:fi .2s}@keyframes fi{from{opacity:0}}
.md{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:22px;width:min(420px,92vw);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.8);opacity:0}}
.tabs{display:flex;gap:8px;margin-bottom:8px}.hide{display:none!important}
#toast{position:fixed;bottom:20px;left:20px;background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:99}
@media(max-width:780px){.wrap{flex-direction:column}aside{width:100%;border:0;border-bottom:3px solid var(--ink);display:grid;grid-template-columns:1fr 1fr;gap:0 8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;padding:34px;border:3px solid var(--ink);border-radius:32px;background:radial-gradient(#c8102e33 1.5px,transparent 1.5px) 0 0/20px 20px,#fff;overflow:hidden;box-shadow:8px 8px 0 var(--rd)}
.hero h1{font-size:clamp(38px,6vw,66px);line-height:1.1;margin:10px 0}.hero em{color:var(--rd);font-style:normal}.hero p{font-size:17px;max-width:520px;line-height:1.8}
.tag{display:inline-flex;gap:6px;align-items:center;background:var(--ink);color:#fff;padding:6px 14px;border-radius:30px;font-weight:700;font-size:13px}
.lg{padding:13px 26px;font-size:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.stats{display:flex;gap:26px;margin-top:20px}.stats b{display:block;font:900 32px Cairo;color:var(--rd);direction:ltr}.stats small{color:#555}
.art{position:relative;min-height:300px;display:flex;align-items:center;justify-content:center}.art img{max-width:100%;max-height:380px;position:relative;filter:drop-shadow(8px 10px 0 #0002);animation:fl 5s ease-in-out infinite}
.blob{position:absolute;width:300px;height:300px;background:var(--rd);border-radius:42% 58% 60% 40%;animation:bl 9s ease-in-out infinite;border:3px solid var(--ink)}@keyframes bl{50%{border-radius:60% 40% 40% 60%;transform:rotate(12deg)}}
.chip{position:absolute;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:700;font-size:13px;box-shadow:3px 3px 0 var(--ink);display:flex;gap:6px;align-items:center;animation:fl 4s ease-in-out infinite;z-index:2}
.ft{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:16px 0 26px}.ft .card{box-shadow:5px 5px 0 var(--ink)}.ft .card:hover{box-shadow:7px 7px 0 var(--rd)}
.ib{width:46px;height:46px;border-radius:14px;background:var(--rd);color:#fff;display:flex;align-items:center;justify-content:center;border:2.5px solid var(--ink);margin-bottom:8px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.steps div{border-inline-start:5px solid var(--rd);padding:6px 14px}.steps b{font-size:18px}
.pi{max-width:100%;max-height:360px;border-radius:14px;border:2px solid var(--ink);margin-top:6px;display:block}
.live{color:var(--rd);animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.3}}.room{text-align:center}
@media(max-width:780px){.hero{grid-template-columns:1fr;padding:20px}}
.hero{background:repeating-conic-gradient(from 0deg at 30% 55%,#c8102e18 0 4deg,transparent 4deg 10deg),radial-gradient(#11111122 1.3px,transparent 1.3px) 0 0/16px 16px,#fff}
.trio{position:relative;display:flex;align-items:flex-end;justify-content:center;z-index:1}.trio svg{margin:0 -16px;filter:drop-shadow(4px 6px 0 #0003);animation:fl 4s ease-in-out infinite}.trio svg:nth-child(2){transform:translateY(-14px);z-index:2;animation-delay:.6s}.trio svg:nth-child(3){animation-delay:1.2s}
.bub{position:absolute;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:6px 16px;font-weight:900;z-index:3;animation:fl 3.5s infinite}.bub:after{content:"";position:absolute;bottom:-14px;inset-inline-start:22px;border:8px solid transparent;border-top-color:var(--ink)}
.ey{transform-box:fill-box;transform-origin:center;animation:bk 4s infinite}@keyframes bk{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.mq{overflow:hidden;background:var(--ink);color:#fff;border-radius:16px;margin:24px 0;padding:10px 0;white-space:nowrap}.mq div{display:inline-block;animation:mq 30s linear infinite;font-weight:900;font-size:18px}.mq span{color:#ff6b81;margin:0 16px}@keyframes mq{to{transform:translateX(50%)}}
.pn{border:3px solid var(--ink);border-radius:18px;background:#fff;padding:18px;box-shadow:6px 6px 0 var(--ink);position:relative;transition:.25s}.pn:nth-child(odd){transform:rotate(-1.2deg)}.pn:nth-child(even){transform:rotate(1.2deg)}.pn:hover{transform:rotate(0) scale(1.05);box-shadow:9px 9px 0 var(--rd)}
.nm{position:absolute;top:-14px;inset-inline-end:14px;background:var(--rd);color:#fff;border:3px solid var(--ink);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font:900 18px Cairo}
.lv{display:flex;justify-content:space-between;margin-bottom:8px}.bar{height:20px;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#eee}.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--rd) 0 10px,#e63950 10px 20px);animation:gr 2s .3s forwards}@keyframes gr{to{width:var(--w)}}
.cta{background:var(--rd);color:#fff;border:3px solid var(--ink);border-radius:28px;padding:30px;text-align:center;box-shadow:8px 8px 0 var(--ink);margin:30px 0}
.lk{position:relative;min-height:400px;border-radius:24px;overflow:hidden}.pv{filter:blur(6px);opacity:.8;pointer-events:none;user-select:none}
.lkc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:linear-gradient(#fff0,#fffc 45%,#ffffffee)}
.lkb{width:68px;height:68px;border-radius:50%;background:var(--rd);color:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:4px 4px 0 var(--ink);animation:fl 3s infinite}.lkb svg{width:32px;height:32px}
.tb{border-collapse:collapse;width:100%;font-size:14px}.tb th,.tb td{border-bottom:1px solid #ddd;padding:8px;text-align:right}.tb th{background:var(--soft)}.btn.sm{padding:3px 10px;font-size:12px;box-shadow:none;margin:2px}
.cf{position:fixed;top:55%;width:10px;height:14px;border:2px solid #111;z-index:99;pointer-events:none;animation:cf 1.4s cubic-bezier(.2,.8,.3,1) forwards}@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
header{box-shadow:0 4px 0 #c8102e22}.logo svg{filter:drop-shadow(2px 2px 0 #0002);transition:.3s}.logo:hover svg{transform:rotate(-8deg) scale(1.08)}
</style></head><body>

<script>
"use strict";
const API="PUT_YOUR_APPS_SCRIPT_EXEC_URL_HERE";
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const S={tok:localStorage.getItem("nw_t"),me:null,tab:"home",tm:null};
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.remove("hide");setTimeout(()=>e.classList.add("hide"),2800)};
async function api(a,d={}){if(API.startsWith("PUT_"))return{err:"ضع رابط Apps Script (exec) في متغيّر API داخل index.html"};try{const r=await fetch(API,{method:"POST",body:JSON.stringify({a,t:S.tok,...d})});const j=await r.json();if(j.err==="auth"){logout(true);}return j}catch(e){return{err:"تعذّر الاتصال بالخادم"}}}
// personnages SVG originaux (style anime, ombrage 3D)
const eye=(x,y)=>`<g class="ey"><ellipse cx="${x}" cy="${y}" rx="4.6" ry="6" fill="#fff" stroke="#111" stroke-width="1.8"/><circle cx="${x}" cy="${y+.6}" r="3.3" fill="#3b1d0e"/><circle cx="${x+1.2}" cy="${y-1}" r="1.2" fill="#fff"/></g>`;
function char(k,s=150){const bd={a:"#c8102e",b:"#2a6df4",c:"#111"}[k];
 const B={a:"",b:"",c:`<path d="M58 22q20 8 11 38-6-14-12-20z" fill="#e0701a" stroke="#111" stroke-width="2.5"/>`}[k];
 const head=`<ellipse cx="40" cy="77" rx="24" ry="3" fill="#0002"/><path d="M14 80q3-18 26-18t26 18z" fill="${bd}" stroke="#111" stroke-width="2.5"/><circle cx="40" cy="38" r="21" fill="url(#sk)" stroke="#111" stroke-width="2.5"/><ellipse cx="27" cy="46" rx="4" ry="2.4" fill="#ff8a9a" opacity=".6"/><ellipse cx="53" cy="46" rx="4" ry="2.4" fill="#ff8a9a" opacity=".6"/>${eye(31,40)}${eye(49,40)}<path d="M33 49q7 7 14 0z" fill="#7a1020" stroke="#111" stroke-width="2"/>`;
 const F={a:`<path d="M19 30q-1-6 3-8M61 30q1-6-3-8" stroke="#111" stroke-width="3" fill="none"/><ellipse cx="40" cy="20" rx="32" ry="6.5" fill="url(#ht)" stroke="#111" stroke-width="2.5"/><path d="M20 20q0-17 20-17t20 17q-20 5-40 0z" fill="url(#ht)" stroke="#111" stroke-width="2.5"/><path d="M20 19q20 5 40 0v-4q-20 5-40 0z" fill="url(#cp)" stroke="#111" stroke-width="2"/>`,
 b:`<path d="M17 36q-6-20 12-22 6-8 22 0 18 2 12 22-6-12-12-14-10 6-22 0-6 2-12 14z" fill="#3a2a1d" stroke="#111" stroke-width="2.5"/><path d="M26 22q14-5 28 0" stroke="#111" stroke-width="3" fill="none"/><circle cx="31" cy="20" r="6.5" fill="#9ee" stroke="#111" stroke-width="2.5"/><circle cx="49" cy="20" r="6.5" fill="#9ee" stroke="#111" stroke-width="2.5"/><path d="M39 42q-8 8 1 9" fill="#e8a877" stroke="#111" stroke-width="2.2"/>`,
 c:`<path d="M18 38q-2-21 22-21t22 21q-5-14-22-14T18 38z" fill="#e0701a" stroke="#111" stroke-width="2.5"/><path d="M57 21l9-7v13zM57 21l-9-7v13z" fill="#c8102e" stroke="#111" stroke-width="2"/>`}[k];
 return `<svg viewBox="0 0 80 82" width="${s}" height="${s}">${B}${head}${F}</svg>`}
document.querySelector("svg defs").insertAdjacentHTML("beforeend",`<symbol id="luffy" viewBox="0 0 80 80">${char("a",0).replace(/<svg[^>]*>|<\/svg>/g,"")}</symbol>`);
const FC={"علوم تجريبية":[["الميتوكوندري؟","مصدر ATP عبر التنفس الخلوي"],["قانون أوم","U = R × I"],["وظيفة الريبوزوم","تركيب البروتين"],["الأنزيم","وسيط حيوي نوعي"]],
"تقني رياضي":[["قانون نيوتن الثاني","ΣF = m·a"],["مشتق sin x","cos x"],["الإجهاد σ","σ = F / S"],["عزم قوة","M = F × d"]],
"رياضيات":[["مجموع حسابية","n(u₁+uₙ)/2"],["∫1/x dx","ln|x| + C"],["نهاية sin x / x","1"]],
"آداب وفلسفة":[["مؤلف «المقدمة»","ابن خلدون"],["الكوجيتو","أنا أفكر إذن أنا موجود"]],
"لغات أجنبية":[["Present perfect","have/has + p.p."],["Subjonctif","il faut que + subj."]],
"تسيير واقتصاد":[["الأصول =","الخصوم + الأموال الخاصة"],["TVA","ضريبة القيمة المضافة"]]};
const SUR={67:"الملك",18:"الكهف",55:"الرحمن",36:"يس"};
const MENT=[{n:"وسام دريدي",d:"باك 15 — علوم طبيعية",c:"c"},{n:"فندي نوفل",d:"باك 17.61 — تقني رياضي، هندسة مدنية",c:"a"}];
const NAV=[["home","home","الرئيسية"],["study","study","ادرس معي"],["cards","cards","فلاش كارد"],["forum","forum","منتدى الطلبة"],["lessons","lessons","دروسي"],["mentors","mentors","متابعة الطالبة"]];
function shell(){const a=$("#auth");
 a.innerHTML=S.me?`<span style="font-weight:700">${ic("user")} ${E(S.me.first)} ${E(S.me.last)}</span> <button class="btn w" id="lo">${ic("out")} خروج</button>`:`<button class="btn" id="li">${ic("user")} فتح حساب / دخول</button>`;
 (S.me?$("#lo"):$("#li")).onclick=S.me?()=>logout():authModal;
 const items=NAV.concat(S.me&&S.me.role==="admin"?[["admin","admin","الإدارة"]]:[]);
 $("#nav").innerHTML=items.map(([k,i,t])=>`<button class="nb ${S.tab===k?"on":""}" data-k="${k}">${ic(i)}${t}</button>`).join("");
 $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.k))}
function logout(q){S.tok=null;S.me=null;localStorage.removeItem("nw_t");S.tab="home";if(!q)toast("تم الخروج");route()}
function go(t){S.tab=t;route()}
function authModal(){const o=document.createElement("div");o.className="ov";let reg=false;
