function startRem(){clearInterval(S.rt);S.rt=setInterval(()=>{if(!S.me)return;const R=REM();if(!R.on||!("Notification"in window)||Notification.permission!=="granted")return;const n=new Date(),hm=("0"+n.getHours()).slice(-2)+":"+("0"+n.getMinutes()).slice(-2);
 ["m","e"].forEach(p=>{const k="nw_nt_"+ldate()+p;if(hm>=R[p]&&hm<=addM(R[p],20)&&!localStorage.getItem(k)&&!doneT(p)){localStorage.setItem(k,"1");const opt={body:(p==="m"?"حان وقت أذكار الصباح":"حان وقت أذكار المساء")+" — اقرأها الآن",icon:"icon-192.png",tag:"nw-"+p,lang:"ar",dir:"rtl"};
  if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification("نويس",opt));else try{new Notification("نويس",opt)}catch(e){}}})},30000)}
function regSW(){if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").then(r=>{if(r.periodicSync)r.periodicSync.register("nw-adhkar",{minInterval:6*3600*1000}).catch(()=>{})}).catch(()=>{})}
function dhikr(m){const tabs=[["m","أذكار الصباح"],["e","أذكار المساء"],["x","أدعية الامتحان"]],cur=S.dt||period()||"m";S.dt=cur;const L=DH[cur],key="nw_dh_"+ldate()+cur;let rem;try{rem=JSON.parse(localStorage.getItem(key))}catch(e){}if(!Array.isArray(rem)||rem.length!==L.length)rem=L.map(x=>x.n);const R=REM();
 m.innerHTML=`<h2>أذكاري</h2><div class="row tabsc">${tabs.map(t=>`<button class="btn ${t[0]===cur?"":"w"}" data-t="${t[0]}">${t[1]}</button>`).join("")}</div>
 ${cur==="x"?`<div class="card mu">ليس في الشرع أذكار مخصوصة بالامتحان بنص ثابت، وهذه آيات وأدعية مأثورة في طلب العلم والتيسير والسكينة.</div>`:""}

 <div class="row"><label><input type="checkbox" id="rn" ${R.on?"checked":""} style="width:auto"> تنبيه المتصفح</label><label>صباحاً <input type="time" id="rm" value="${R.m}" style="width:auto"></label><label>مساءً <input type="time" id="re" value="${R.e}" style="width:auto"></label></div>
 <div class="row"><label><input type="checkbox" id="rml" ${S.me.remind?"checked":""} style="width:auto"> أرسل لي الأذكار على بريدي صباحاً ومساءً</label></div></div>`;
 const save=()=>localStorage.setItem(key,JSON.stringify(rem)),
 upd=()=>{const dn=rem.filter(v=>v===0).length;$("#dp").style.setProperty("--w",Math.round(dn/L.length*100)+"%");$("#dm").textContent=`أنجزت ${dn} من ${L.length}`;
  if(dn===L.length&&!localStorage.getItem("nw_da_"+ldate()+cur)){localStorage.setItem("nw_da_"+ldate()+cur,"1");localStorage.setItem("nw_dd_"+ldate()+cur,"1");remBar();boom();toast("تقبّل الله منك");api("act.add",{kind:"dhikr",title:cur})}},
 paint=()=>{$("#dl").innerHTML=L.map((x,i)=>`<div class="dc ${rem[i]===0?"done":""}" data-i="${i}"><div class="dtx">${E(x.t)}</div><div class="row" style="justify-content:space-between"><span class="mu">${E(x.s)}</span><span class="ct">${rem[i]===0?"✓":rem[i]}</span></div></div>`).join("");
  $("#dl").querySelectorAll(".dc").forEach(e=>e.onclick=()=>{const i=+e.dataset.i;if(rem[i]>0){rem[i]--;save();paint();upd()}})};
 paint();upd();
 m.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.dt=b.dataset.t;dhikr(m)});
 const sv=()=>localStorage.setItem("nw_rem",JSON.stringify({on:$("#rn").checked,m:$("#rm").value||"06:00",e:$("#re").value||"17:30"}));
 $("#rm").onchange=sv;$("#re").onchange=sv;
 $("#rn").onchange=async()=>{if($("#rn").checked){if(!("Notification"in window)){$("#rn").checked=false;return toast("المتصفح لا يدعم التنبيهات")}const r=await Notification.requestPermission();if(r!=="granted"){$("#rn").checked=false;return toast("لم يُمنح الإذن بالتنبيهات")}}sv();startRem();regSW()};
 $("#rml").onchange=async()=>{const on=$("#rml").checked?1:0,r=await api("profile.remind",{on});if(r.err){$("#rml").checked=!on;return toast(r.err)}S.me.remind=on;toast(on?"سنرسل لك الأذكار على بريدك":"أُوقف إرسال البريد")}}
function admin(m){if(!S.me||S.me.role!=="admin")return m.innerHTML=lock();
 const T=[["ov","نظرة عامة"],["us","الحسابات"],["fo","المنتدى"],["no","الإشعارات"],["le","الدروس"],["se","الجلسات"],["dm","الرسائل"],["wd","الفلترة"]],cur=S.at||"ov";
 m.innerHTML=`<h2>لوحة الإدارة</h2><div class="row tabsc">${T.map(t=>`<button class="btn ${t[0]===cur?"":"w"}" data-t="${t[0]}">${t[1]}</button>`).join("")}</div><div id="ab">جارٍ التحميل…</div>`;
 m.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.at=b.dataset.t;admin(m)});
 const ab=$("#ab"),re=()=>admin(m),dt=x=>new Date(+x).toLocaleString("ar-DZ"),
 act=(sel,fn)=>ab.querySelectorAll(sel).forEach(b=>b.onclick=async()=>{const r=await fn(b);if(r&&r.err)toast(r.err);re()}),
 big=(t,v)=>`<div class="card"><b>${t}</b><div class="cnt" style="font-size:34px">${v}</div></div>`,
 img=u=>/^https:\/\/drive\.google\.com\//.test(u||"")?`<img class="pi" loading="lazy" src="${E(u)}" alt="">`:"",

  ab.innerHTML=`<div class="g">${big("الطلبة",s.students)}${big("ساعات الدراسة",s.hours)}${big("منشورات المنتدى",s.posts)}${big("غرف مباشرة الآن",s.live)}</div><div class="card"><b>التوزيع حسب الشعبة</b>${Object.entries(tr).map(([k,v])=>`<div class="m">${E(k)}: ${v}</div>`).join("")||"—"}</div>`},
 async us(){const r=await api("users.list");ab.innerHTML=`<div class="card" style="overflow:auto"><table class="tb"><tr><th>الاسم</th><th>العمر</th><th>الشعبة</th><th>البريد</th><th>الدور</th><th>التسجيل</th><th></th></tr>${(r.d||[]).map(u=>`<tr><td>${E(u.first)} ${E(u.last)}</td><td>${E(u.age)}</td><td>${E(u.track)}</td><td dir="ltr">${E(u.email)}</td><td>${u.role==="admin"?"مدير":"طالب"}${String(u.banned)==="1"?" • موقوف":""}</td><td>${dt(u.at)}</td><td>${u.main?"":`<button class="btn w sm" data-b="${u.id}">${String(u.banned)==="1"?"رفع الإيقاف":"إيقاف"}</button> <button class="btn w sm" data-p="${u.id}">كلمة سر</button> <button class="btn w sm" data-r="${u.id}">${u.role==="admin"?"إلغاء مدير":"ترقية"}</button> <button class="btn w sm" data-x="${u.id}">${ic("trash")}</button>`}</td></tr>`).join("")}</table></div>`;
  act("[data-b]",b=>api("users.ban",{id:b.dataset.b}));act("[data-r]",b=>api("users.role",{id:b.dataset.r}));

  act("[data-x]",b=>confirm("حذف الحساب نهائياً؟")?api("users.del",{id:b.dataset.x}):null)},
 async fo(){const r=await api("posts.list");ab.innerHTML=`<div class="card">${(r.d||[]).map(p=>`<div class="m"><b>${E(p.name)}</b> <span class="mu">${dt(p.at)}</span> <button class="btn w sm" data-d="${p.id}">${ic("trash")}</button><br>${E(p.text)}${img(p.img)}</div>`).join("")||"لا منشورات"}</div>`;act("[data-d]",b=>api("posts.del",{id:b.dataset.d}))},
 async no(){const r=await api("notices.all");ab.innerHTML=`<div class="card"><b>${ic("bell")} إشعار جديد</b><input id="an" maxlength="300"><button class="btn" id="as">نشر</button></div><div class="card">${(r.d||[]).slice().reverse().map(n=>`<div class="m">${E(n.text)} <span class="mu">${dt(n.at)}</span> <button class="btn w sm" data-d="${n.id}">${ic("trash")}</button></div>`).join("")||"لا إشعارات"}</div>`;
  $("#as").onclick=async()=>{const x=await api("notices.add",{text:$("#an").value});toast(x.err||"نُشر");re()};act("[data-d]",b=>api("notices.del",{id:b.dataset.d}))},
 async le(){const r=await api("lessons.list");ab.innerHTML=`<div class="card"><b>${ic("file")} إضافة درس</b><input id="at" placeholder="العنوان"><input id="au2" placeholder="رابط https (Drive أو YouTube)" dir="ltr"><select id="ak"><option value="pdf">PDF</option><option value="vid">فيديو</option></select><p class="mu">في Drive: شارك الملف «أي شخص لديه الرابط». يُعرض داخل المنصة دون خروج الطالب.</p><button class="btn" id="al">إضافة</button></div><div class="card">${(r.d||[]).map(x=>`<div class="m">${x.kind==="vid"?"فيديو":"PDF"} — ${E(x.title)} <button class="btn w sm" data-d="${x.id}">${ic("trash")}</button></div>`).join("")||"لا دروس"}</div>`;
  $("#al").onclick=async()=>{const x=await api("lessons.add",{title:$("#at").value,url:$("#au2").value,kind:$("#ak").value});toast(x.err||"أُضيف");re()};act("[data-d]",b=>api("lessons.del",{id:b.dataset.d}))},
 async se(){const r=await api("study.list");ab.innerHTML=`<div class="card">${(r.d||[]).map(x=>`<div class="m">${dt(x.start)} — ${x.len} د — ${String(x.members).split(";").length} طالب <button class="btn w sm" data-d="${x.id}">${ic("trash")}</button></div>`).join("")||"لا جلسات قادمة"}</div>`;act("[data-d]",b=>api("study.del",{id:b.dataset.d}))},
 async dm(){const r=await api("dm.admin"),G={};(r.d||[]).forEach(x=>{const k=x.uid+"|"+x.mentor;(G[k]=G[k]||[]).push(x)});

  act("[data-s]",b=>{const[u,i]=b.dataset.s.split("|"),v=ab.querySelector(`[data-i="${b.dataset.s}"]`).value;return v?api("dm.reply",{uid:u,mentor:i,text:v}):null})},
 async wd(){const r=await api("words.get");ab.innerHTML=`<div class="card"><b>الكلمات الممنوعة (مفصولة بفاصلة)</b><textarea id="wt" rows="4">${E(r.v||"")}</textarea><button class="btn" id="ws">حفظ</button><p class="mu">تُضاف إلى القائمة الافتراضية. الروابط ممنوعة دائماً.</p></div>`;$("#ws").onclick=async()=>{const x=await api("words.set",{v:$("#wt").value});toast(x.err||"حُفظ")}}};
 V[cur]()}
(async()=>{if(S.tok){const r=await api("me");if(r.me)S.me=r.me;else S.tok=null}route();regSW();startRem();if(location.hash==="#dhikr"&&S.me)go("dhikr")})();
